# Anki Studio in locale o per un deploy di prova: l'immagine unica (PWA + API) costruita
# dal Dockerfile alla radice, con lo stesso hardening previsto nello stack.
#
#   cp .env.example .env   # imposta ANKI_PUBLIC_URL e ANKI_OIDC_* (login con Authentik)
#   docker compose up -d --build
#
# La PWA risponde su http://127.0.0.1:8080. In produzione l'immagine viene da GHCR e il
# servizio sta nello stack principale: vedi deploy/stack/ e la sezione "Pubblicazione"
# del README.
#
# Su myserv il daemon ha "bridge": "none": la build ha rete solo con un
# docker-compose.override.yml (ignorato da git) che aggiunge `build: network: host`
# al servizio `anki-studio`.
name: anki-studio

services:
  anki-studio:
    build:
      context: .
      args:
        VERSION: dev
    image: anki-studio:local
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      # collezione, media, backup e chiave di sync AnkiWeb. Backup: vedi backend/README.md.
      - anki-data:/data
    # richieste in corso (30 s) + attesa della sync in corso (30 s) + ultima sync (15 s):
    # Docker non deve uccidere il processo mentre scrive la collezione
    stop_grace_period: 120s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    # healthcheck: quello dell'immagine (GET /api/health ogni 30 s)

volumes:
  anki-data:
