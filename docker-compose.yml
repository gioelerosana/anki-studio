# Stack di Anki Studio: PWA (nginx) + API (FastAPI + motore Anki).
#
#   cp .env.example .env   # imposta ANKI_API_TOKEN
#   docker compose up -d --build
#
# Esposizione su internet: la gestisce il Traefik dello stack principale, che va
# collegato al servizio `web` (porta 80). Qui `web` è pubblicato solo su localhost
# per i test; l'API non è mai esposta direttamente.
name: anki-studio

services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      ANKI_DATA_DIR: /data
    volumes:
      # collezione, media, backup e chiave di sync AnkiWeb. Backup: vedi backend/README.md.
      - anki-data:/data
    # richieste in corso (30 s) + attesa della sync in corso (30 s) + ultima sync (15 s):
    # Docker non deve uccidere il processo mentre scrive la collezione
    stop_grace_period: 120s
    healthcheck:
      # 200 anche durante una sync lunga ("busy"): un riavvio a metà sarebbe peggio
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"

volumes:
  anki-data:
