<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 256 256">
  <!-- Colori invertiti rispetto a XMap Studio (fondo chiaro, carta scura): accanto sul desktop non si confondono. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4e4e7"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- carta dietro -->
  <rect x="70" y="52" width="136" height="100" rx="14" fill="#c4c4ca" transform="rotate(8 138 102)"/>
  <!-- carta davanti -->
  <rect x="50" y="82" width="140" height="104" rx="14" fill="#18181b"/>
  <rect x="68" y="104" width="72" height="12" rx="6" fill="#fafafa"/>
  <rect x="68" y="126" width="48" height="10" rx="5" fill="#71717a"/>
  <!-- pulsante "Bene" -->
  <rect x="120" y="154" width="54" height="18" rx="9" fill="#3b6cf6"/>
</svg>
