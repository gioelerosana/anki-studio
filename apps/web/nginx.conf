# Serve la PWA e inoltra /api al backend: tutto sulla stessa origine
# (niente CORS, il cookie dei media funziona). Davanti va il reverse proxy
# HTTPS dello stack (Traefik), che punta a questo container sulla porta 80.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # una full sync con AnkiWeb può durare minuti
        proxy_read_timeout 600s;
    }

    # Service worker e manifest: mai in cache HTTP, così gli aggiornamenti arrivano subito.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Bundle con hash nel nome: cache lunga.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: ogni altra rotta restituisce index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
