version: 1
metadata:
  name: Anki Studio OIDC
  labels:
    blueprints.goauthentik.io/description: >
      OAuth2/OIDC provider for Anki Studio (anki.jshep.xyz).
      Issuer: https://auth.jshep.xyz/application/o/anki-studio/
      Confidential client: the FastAPI backend does the code exchange (Authorization
      Code + PKCE, "backend for frontend") and keeps the PWA session in an HttpOnly
      cookie, so the iPad PWA never sees a token. Consumed via ANKI_OIDC_* in
      COMPOSE/compose.anki-studio.yml.
      The client_secret is intentionally NOT declared here: Authentik generates one
      on first apply and the value is copied to .secrets/anki_oidc_client_secret.txt
      (Docker secret anki_oidc_client_secret). Omitting the field keeps the existing
      value on later `present` re-applies.
      Redirect URI: https://anki.jshep.xyz/api/auth/callback (from ANKI_PUBLIC_URL).

      ACCESS: deny-by-default. Only superusers and members of "authentik Admins"
      pass the anki-studio-admins-only policy bound to the application (the Anki
      collection is a single personal account).

entries:

  # ── OAuth2/OIDC Provider: Anki Studio ─────────────────────────
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: Anki Studio
    attrs:
      name: Anki Studio
      client_type: confidential
      client_id: anki-studio
      # implicit consent: no "allow access" page on every login, the access
      # decision is the policy below
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      authentication_flow: !Find [authentik_flows.flow, [slug, smart-login-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      issuer_mode: per_provider
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      access_code_validity: minutes=1
      # the backend only reads the ID token once, at login: short tokens, no refresh
      access_token_validity: minutes=5
      refresh_token_validity: days=1
      logout_method: backchannel
      logout_uri: ""
      # MUST be declared explicitly: blueprint-created providers get an EMPTY
      # grant_types array and the authorize endpoint rejects every request
      # (see litellm-oidc.yaml).
      grant_types:
        - authorization_code
      encryption_key: null
      jwt_federation_providers: []
      jwt_federation_sources: []
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'openid'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
      redirect_uris:
        - matching_mode: strict
          url: https://anki.jshep.xyz/api/auth/callback

  # ── Application: Anki Studio ──────────────────────────────────
  - model: authentik_core.application
    state: present
    identifiers:
      slug: anki-studio
    attrs:
      name: Anki Studio
      slug: anki-studio
      group: Studio
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Anki Studio]]
      meta_launch_url: https://anki.jshep.xyz/
      meta_description: Anki flashcards PWA for iPad

  # ── Access policy: authentik Admins only ──────────────────────
  # Without an explicit policy Authentik grants access to ALL authenticated users.
  - model: authentik_policies_expression.expressionpolicy
    state: present
    identifiers:
      name: anki-studio-admins-only
    attrs:
      name: anki-studio-admins-only
      expression: |
        user = getattr(request, "user", None)
        if user is None or not user.is_authenticated:
            return False
        return bool(user.is_superuser or user.groups.filter(name="authentik Admins").exists())

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      pk: 42f03bdb-749c-4bde-8eec-c37161ea7c81
    attrs:
      target: !Find [authentik_core.application, [slug, anki-studio]]
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, anki-studio-admins-only]]
      enabled: true
      order: 0
