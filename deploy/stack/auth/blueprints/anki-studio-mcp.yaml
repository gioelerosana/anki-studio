version: 1
metadata:
  name: Anki Studio MCP
  labels:
    blueprints.goauthentik.io/description: >
      SECOND OAuth2/OIDC provider for Anki Studio: the MCP server at
      https://anki.jshep.xyz/mcp, used by the Claude apps (web, desktop, mobile)
      as a custom connector.
      Issuer: https://auth.jshep.xyz/application/o/anki-studio-mcp/
      Apply AFTER anki-studio-oidc.yaml (the access policy bound here is defined there).

      Why a separate provider (and not the "Anki Studio" one used by the PWA login):
      different client_id (the backend checks `aud` == ANKI_MCP_OIDC_CLIENT_ID, so a
      token minted for the PWA login can never open /mcp), different redirect URI,
      signed tokens with a public JWKS, long refresh tokens. The PWA login stays
      untouched (HS256, 5 min, no refresh).

      Confidential client, pre-registered: Claude uses the client ID and secret that
      you paste in the "Add custom connector" dialog (Advanced settings). Dynamic
      Client Registration is NOT used on purpose: in Authentik it needs a bearer token
      with the dedicated scope `goauthentik.io/oidc/dcr` and creates a new
      application + provider for EVERY registration, which would fill the instance
      with orphan providers. The discovery document of this provider therefore does
      not advertise a `registration_endpoint` (it only does so when a DCR
      configuration exists on the provider: do not add one).

      Where to read client ID and secret (to paste in Claude):
        Admin interface -> Applications -> Providers -> "Anki Studio MCP"
        client ID  = anki-studio-mcp (fixed, declared below)
        client secret = generated by Authentik on first apply (see below).
      The client_secret is intentionally NOT declared here (same as the OIDC blueprint):
      Authentik generates one on first apply, and omitting the field keeps the existing
      value on later `present` re-applies. The BACKEND NEVER NEEDS IT: it only
      validates the JWTs with the public JWKS of the issuer. The secret is used only by
      Claude (its servers do the code exchange), so it is not a Docker secret of the
      container: paste it in the connector dialog and keep a copy in the password manager.
      Claude cannot change the credentials of a connector afterwards: after rotating the
      secret, remove the connector and add it again.

      Redirect URI: https://claude.ai/api/mcp/auth_callback (strict, no wildcard). It is
      the same for claude.ai, Claude Desktop and the mobile apps (the connection starts
      from Anthropic's cloud, not from the device). Claude Code does NOT use this client:
      it connects with the Bearer token created in the PWA (Settings -> Agents).

      TOKENS: the access token is a JWT signed with the provider's signing key (asymmetric
      -> JWKS at https://auth.jshep.xyz/application/o/anki-studio-mcp/jwks/). In Authentik
      the access token carries the same claims as the ID token, and
      include_claims_in_id_token=true puts there the claims of the requested scopes:
      `preferred_username` and `groups` come from the `profile` scope, so the connector
      MUST request `profile` (the backend advertises it in the protected resource
      metadata). `aud` is the client_id.

      ACCESS: deny-by-default, same as the PWA: only the policy anki-studio-admins-only
      (superusers and "authentik Admins") passes. The backend checks it again
      (ANKI_OIDC_ALLOWED_USERS / ANKI_OIDC_ALLOWED_GROUPS).

entries:

  # ── OAuth2/OIDC Provider: Anki Studio MCP ─────────────────────
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: Anki Studio MCP
    attrs:
      name: Anki Studio MCP
      client_type: confidential
      client_id: anki-studio-mcp
      # implicit consent: no "allow access" page at every connection, the access
      # decision is the policy below
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      authentication_flow: !Find [authentik_flows.flow, [slug, smart-login-flow]]
      # ASYMMETRIC signing key: without it Authentik signs with HS256 using the client
      # secret and publishes no JWKS, so the backend could not verify anything. Same
      # certificate-key pair that the other providers already use; RSA -> RS256.
      # To use another one (e.g. a dedicated key for this provider): change the name
      # here, or in the UI: Providers -> Anki Studio MCP -> Edit -> Signing Key.
      # Rotating the key invalidates the access tokens in flight (they last 15 minutes,
      # Claude refreshes by itself); the backend keeps the JWKS in cache, so after a
      # rotation the first calls may fail until the cache expires.
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      issuer_mode: per_provider
      # `sub` is opaque on purpose: the backend identifies the user with the
      # `preferred_username` claim (profile scope), not with `sub`.
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      access_code_validity: minutes=1
      # 15 minutes: short enough that a stolen token is almost useless (the JWT is
      # stateless: it cannot be revoked, only wait for it to expire), long enough that
      # Claude does not refresh at every call (it refreshes proactively 5 minutes
      # before expiry and reactively on 401; with 5 minutes it would refresh constantly).
      access_token_validity: minutes=15
      # 90 days: the connection must survive weeks without use, otherwise the user has
      # to sign in again on Authentik. To cut the access of a connector: delete the
      # OAuth tokens of the provider (Admin -> Events/Tokens, to check in the UI) and
      # revoke the connector in Claude; the access token in flight lasts 15 minutes at most.
      refresh_token_validity: days=90
      # Rotation only in the last 30 days (sliding window): every refresh would otherwise
      # revoke the old refresh token and issue a new one (seconds=0 = always), and a lost
      # response, or two Claude surfaces refreshing together, would break the connection.
      # With this value the refresh token is replaced about once a month.
      refresh_token_threshold: days=30
      logout_method: backchannel
      logout_uri: ""
      # MUST be declared explicitly: blueprint-created providers get an EMPTY
      # grant_types array and the authorize endpoint rejects every request
      # (see litellm-oidc.yaml). `refresh_token` is needed here (unlike the PWA
      # login): without it the connector would expire after 15 minutes.
      grant_types:
        - authorization_code
        - refresh_token
      encryption_key: null
      jwt_federation_providers: []
      jwt_federation_sources: []
      # Scopes allowed = scope mappings attached to the provider (there is no other
      # field for it). `profile` is what puts preferred_username and groups in the token;
      # `offline_access` is what makes Authentik issue the refresh token.
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'openid'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'offline_access'"]]
      # EXACT match, one URI. Claude sends this one only (PKCE S256 on every request is
      # done by Claude, Authentik supports it: no setting needed). Do not add loopback
      # or wildcard entries: Claude Code uses its own Bearer token.
      redirect_uris:
        - matching_mode: strict
          url: https://claude.ai/api/mcp/auth_callback

  # ── Application: Anki Studio MCP ──────────────────────────────
  # The slug decides the issuer: https://auth.jshep.xyz/application/o/anki-studio-mcp/
  - model: authentik_core.application
    state: present
    identifiers:
      slug: anki-studio-mcp
    attrs:
      name: Anki Studio MCP
      slug: anki-studio-mcp
      group: Studio
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Anki Studio MCP]]
      # nothing to open in a browser: hidden from "My applications"
      meta_hide: true
      meta_description: MCP server of Anki Studio for the Claude connector (OAuth)

  # ── Access policy: the same as the PWA ────────────────────────
  # Without a binding Authentik grants access to ALL authenticated users. The policy
  # anki-studio-admins-only is created by anki-studio-oidc.yaml: apply that one first.
  # To restrict it further (another group, only your user), change the policy there:
  # it applies to both applications.
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      pk: 82031016-1293-4f86-94ad-ac8823f2ba0b
    attrs:
      target: !Find [authentik_core.application, [slug, anki-studio-mcp]]
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, anki-studio-admins-only]]
      enabled: true
      order: 0
