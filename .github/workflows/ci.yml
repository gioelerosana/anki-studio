# CI e pubblicazione dell'immagine.
#
# - Ogni PR e ogni push: typecheck e build della PWA, pytest del backend, build
#   dell'immagine per linux/amd64 e linux/arm64 con l'avvio di prova
#   (scripts/smoke-test-image.sh). Niente push.
# - Push di un tag vX.Y.Z: in più pubblica ghcr.io/<owner>/<repo> (minuscolo) con i tag X.Y.Z,
#   X.Y, latest (solo per le release stabili, non per vX.Y.Z-rc.1) e sha-<commit>.
#
# Unico segreto: GITHUB_TOKEN. `packages: write` ce l'ha solo il job `publish`.
# Le action sono pinnate per SHA (Dependabot le aggiorna, vedi dependabot.yml).
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # una release non viene mai annullata da un push successivo
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  web:
    name: PWA (typecheck e build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # versione di pnpm da "packageManager" in package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  api:
    name: Backend (pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/requirements.lock
      # le stesse versioni dell'immagine (requirements.lock), più gli strumenti di test
      - name: Dipendenze
        working-directory: backend
        run: |
          uv venv .venv
          uv pip install --python .venv --require-hashes -r requirements.lock
          uv pip install --python .venv -e ".[dev]"
      - name: pytest
        working-directory: backend
        run: .venv/bin/python -m pytest -q

  image:
    name: Immagine (build multi-arch e avvio di prova)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # amd64 caricata nel daemon del runner per l'avvio di prova
      - name: Build linux/amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: anki-studio:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Avvio di prova
        run: scripts/smoke-test-image.sh anki-studio:ci
      # arm64 (il server è Oracle Ampere): solo build, sotto QEMU
      - name: Build linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Pubblica su GHCR
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, api, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nome dell'immagine
        id: image
        # GHCR vuole il nome in minuscolo (l'owner GitHub può avere maiuscole)
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Controllo del tag
        # vX.Y.Z o vX.Y.Z-qualcosa: altrimenti metadata-action non genera i tag semver
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::tag $GITHUB_REF_NAME non è vX.Y.Z"; exit 1; }
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadati (tag, label OCI, annotazioni)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # annotazioni anche sull'indice multi-arch: GHCR mostra la descrizione da lì
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Anki Studio
            org.opencontainers.image.description=PWA per iPad per studiare le flashcard Anki, sincronizzata con AnkiWeb
          annotations: |
            org.opencontainers.image.title=Anki Studio
            org.opencontainers.image.description=PWA per iPad per studiare le flashcard Anki, sincronizzata con AnkiWeb
      - name: Build e push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Riepilogo
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Immagine pubblicata"
            echo
            echo "Riferimento da pinnare nello stack (\`deploy/stack/compose.anki-studio.yml\`):"
            echo
            echo '```'
            echo "${IMAGE}:${VERSION}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
